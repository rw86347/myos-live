# MyOS's additions to Chromium's flags (read after chromium.conf by Alpine's
# launcher, /usr/lib/chromium/chromium-launcher.sh, for every start: the
# Start menu, a terminal, a page opened from My Files).
#
# --disable-gpu   no GL or Vulkan window surfaces on MyOS yet: Chromium draws
#                 in software instead of starting a GPU process that fails.
# --no-sandbox    Chromium's sandbox needs seccomp-bpf and user namespaces,
#                 which the MyOS kernel does not have yet; without this it
#                 refuses to start. Web pages then run without that extra
#                 wall (docs/gaps.md).
# --disable-features=AsyncDns   look names up with musl, which reads
#                 /etc/resolv.conf (a link to /proc/net/dns) afresh every
#                 time: Chromium's own resolver reads it once and waits for a
#                 change notice that a /proc file never sends, so a browser
#                 started before Wi-Fi had its lease would never find DNS.
CHROMIUM_FLAGS="$CHROMIUM_FLAGS --no-sandbox --disable-gpu --disable-features=AsyncDns"
