# ALSA's "default" device on MyOS: straight to the first card through
# `plug`, which converts any rate, format or channel count a program
# sends into what the card plays (48 kHz, 16 or 24 bits, stereo).
#
# alsa-lib's own default for HD Audio cards (cards/HDA-Intel.conf) adds
# `softvol` and `dmix`, a software mixer so several programs can play at
# once; those need ALSA's timer device and user-added mixer controls,
# which the MyOS kernel does not have yet (docs/gaps.md). Until a sound
# server mixes for everyone (docs/SOUND-PLAN.md S5), one program at a time
# plays; a second one is told the device is busy.
pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}
ctl.!default {
    type hw
    card 0
}
