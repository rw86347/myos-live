# 10-myos.conf — the X server on MyOS.
#
# There is no udev to announce devices, so they are named here: the screen
# is the framebuffer /dev/fb0 (fbdev driver), the keyboard and mouse are
# the kernel's evdev files /dev/input/event0 and event1.

Section "ServerFlags"
    Option "AutoAddDevices"   "false"
    Option "AutoEnableDevices" "false"
    Option "AutoAddGPU"       "false"
EndSection

# MIT-SHM is on (the server's default): a program hands the X server its
# pictures in System V shared memory (kernel/shm.c) instead of sending
# every pixel down the socket. It used to be switched off here, when MyOS
# had no shared memory and Imlib2 (IceWM, the login screen) drew nothing
# through it; systest's "shm as X uses it" checks what the server needs.

Section "Device"
    Identifier "screen0"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "screen"
    Device     "screen0"
EndSection

Section "InputDevice"
    Identifier "keyboard"
    Driver     "evdev"
    Option     "Device" "/dev/input/event0"
    Option     "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier "mouse"
    Driver     "evdev"
    Option     "Device" "/dev/input/event1"
EndSection

Section "ServerLayout"
    Identifier  "myos"
    Screen      "screen"
    InputDevice "keyboard" "CoreKeyboard"
    InputDevice "mouse"    "CorePointer"
EndSection
