# 10-myos.conf — the X server on MyOS.
#
# There is no udev to announce devices, so they are named here: the screen
# is the framebuffer /dev/fb0 (fbdev driver), the keyboard and mouse are
# the kernel's evdev files /dev/input/event0 and event1.

Section "ServerFlags"
    Option "AutoAddDevices"   "false"
    Option "AutoEnableDevices" "false"
    Option "AutoAddGPU"       "false"
EndSection

# MyOS has no System V shared memory, so a program cannot hand the X server
# a picture through shared pages. The server would otherwise announce
# MIT-SHM and every image library (Imlib2, which IceWM and the login screen
# both use) would take that path and draw nothing. Switched off, they send
# the pixels down the socket instead, which is what a local X server on a
# 20-year-old PC did anyway.
Section "Extensions"
    Option "MIT-SHM" "Disable"
EndSection

Section "Device"
    Identifier "screen0"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "screen"
    Device     "screen0"
EndSection

Section "InputDevice"
    Identifier "keyboard"
    Driver     "evdev"
    Option     "Device" "/dev/input/event0"
    Option     "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier "mouse"
    Driver     "evdev"
    Option     "Device" "/dev/input/event1"
EndSection

Section "ServerLayout"
    Identifier  "myos"
    Screen      "screen"
    InputDevice "keyboard" "CoreKeyboard"
    InputDevice "mouse"    "CorePointer"
EndSection
