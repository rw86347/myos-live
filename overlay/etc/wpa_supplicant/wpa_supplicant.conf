# wpa_supplicant's settings: how it is controlled, and the Wi-Fi networks
# this computer joins. The Wi-Fi icon in the taskbar (myos-wifi) adds the
# networks people connect to and saves them here (update_config), so they
# are joined again by themselves. Members of "netdev" may control it
# (everyone with an account: Wi-Fi is everyone's, as on Windows).
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
