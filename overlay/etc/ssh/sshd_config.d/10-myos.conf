# MyOS live disk: do not let the empty live passwords in over the network.
# Set one with `passwd` (or `doas passwd myos`) before you expect a login.
PermitRootLogin no
PermitEmptyPasswords no
PasswordAuthentication yes
KbdInteractiveAuthentication no
X11Forwarding no
UseDNS no
PrintMotd yes
# Keys may also live outside the home directory, owned by root:
# tools/myos-ssh.sh setup puts the build Mac's key in
# /etc/ssh/authorized_keys/myos (from live/overlay.local). sshd keeps the first
# value it reads for a setting, and Alpine's sshd_config reads this file first.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u
# MyOS has no IPv6: listen on IPv4 only, rather than fail on :: at every start.
AddressFamily inet
