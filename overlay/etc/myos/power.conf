# /etc/myos/power.conf — sleep, as on a Mac (docs/SLEEP-PLAN.md).
# myos-powerd reads the lid and power button lines, myos-idle the rest;
# both read it again each time, so an edit needs no restart. The keys and
# values are docs/power-performance-settings.md's.

lid_close=sleep                     # sleep | display_off | nothing
power_button=sleep                  # sleep | poweroff | ignore

lock_on_wake=1                      # the lock screen is what waking shows
lock_on_display_off=1               # and it locks when the screen goes off

# On battery: sleep this long after the screen went off (0: never).
# Plugged in, it never sleeps by itself.
sleep_after_display_off_minutes=1
