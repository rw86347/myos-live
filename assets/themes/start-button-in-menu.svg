<?xml version="1.0" encoding="UTF-8"?>
<!-- The three Start button shapes (start-button-options.svg) in the start menu
     mockup, side by side. Built by hand over myos-xp-startmenu.jpg. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 2592 1222" width="2592" height="1222">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe36a"/><stop offset="0.45" stop-color="#3fb447"/>
      <stop offset="0.55" stop-color="#2c9431"/><stop offset="1" stop-color="#1c6b21"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e2c52"/><stop offset="1" stop-color="#1b5d74"/>
    </linearGradient>
    <linearGradient id="barshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="2" dy="0" stdDeviation="2" flood-color="#06142c" flood-opacity="0.6"/>
    </filter>
    <filter id="textshadow" x="-10%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#0b3d0f" flood-opacity="0.75"/>
    </filter>
    <path id="shapeA" d="M0,2 H150 C196,2 230,16 252,40 C228,56 196,62 150,62 H0 Z"/>
    <clipPath id="clipA"><use xlink:href="#shapeA"/></clipPath>
    <path id="shapeB" d="M0,2 H140 C200,2 250,22 300,48 C250,58 200,62 140,62 H0 Z"/>
    <clipPath id="clipB"><use xlink:href="#shapeB"/></clipPath>
    <path id="shapeC" d="M0,2 H136 C150,2 158,4 170,8 L238,32 C252,37 252,62 236,62 H0 Z"/>
    <clipPath id="clipC"><use xlink:href="#shapeC"/></clipPath>
    <g id="label">
      <circle cx="32" cy="32" r="12.5" fill="none" stroke="#ffffff" stroke-width="3.2"/>
      <circle cx="32" cy="32" r="4.6" fill="#ffffff"/>
      <text x="55" y="43" font-family="Trebuchet MS, Verdana, sans-serif" font-size="30"
            font-weight="bold" font-style="italic" fill="#ffffff" filter="url(#textshadow)">Start</text>
    </g>
  </defs>
  <rect width="100%" height="100%" fill="#eceff1"/>
  <g transform="translate(0,0)">
    <image xlink:href="myos-xp-startmenu.jpg" width="864" height="1152"/>
    <!-- "Help", spelled right -->
    <rect x="462" y="624" width="72" height="40" fill="#f9e6c1"/>
    <text x="467" y="654" font-family="Verdana, sans-serif" font-size="27" font-weight="bold" fill="#1f6d72">Help</text>
    <!-- the taskbar, redrawn, with the new button -->
    <rect y="988" width="864" height="164" fill="url(#bar)"/>
    <rect y="988" width="864" height="164" fill="url(#barshade)"/>
    <rect y="988" width="864" height="2" fill="#7fb6e6" opacity="0.8"/>
    <g transform="translate(0,1024) scale(1.45)">
      <g filter="url(#drop)"><use xlink:href="#shapeA" fill="url(#green)" stroke="#145a19" stroke-width="1.5"/></g>
      <rect width="320" height="30" fill="url(#shine)" clip-path="url(#clipA)"/>
      <use xlink:href="#label"/>
    </g>
  </g>
  <text x="24" y="1198" font-family="Verdana, sans-serif" font-size="30" fill="#333">A - leaf tip</text>
  <g transform="translate(864,0)">
    <image xlink:href="myos-xp-startmenu.jpg" width="864" height="1152"/>
    <!-- "Help", spelled right -->
    <rect x="462" y="624" width="72" height="40" fill="#f9e6c1"/>
    <text x="467" y="654" font-family="Verdana, sans-serif" font-size="27" font-weight="bold" fill="#1f6d72">Help</text>
    <!-- the taskbar, redrawn, with the new button -->
    <rect y="988" width="864" height="164" fill="url(#bar)"/>
    <rect y="988" width="864" height="164" fill="url(#barshade)"/>
    <rect y="988" width="864" height="2" fill="#7fb6e6" opacity="0.8"/>
    <g transform="translate(0,1024) scale(1.45)">
      <g filter="url(#drop)"><use xlink:href="#shapeB" fill="url(#green)" stroke="#145a19" stroke-width="1.5"/></g>
      <rect width="320" height="30" fill="url(#shine)" clip-path="url(#clipB)"/>
      <use xlink:href="#label"/>
    </g>
  </g>
  <text x="888" y="1198" font-family="Verdana, sans-serif" font-size="30" fill="#333">B - swoosh tail</text>
  <g transform="translate(1728,0)">
    <image xlink:href="myos-xp-startmenu.jpg" width="864" height="1152"/>
    <!-- "Help", spelled right -->
    <rect x="462" y="624" width="72" height="40" fill="#f9e6c1"/>
    <text x="467" y="654" font-family="Verdana, sans-serif" font-size="27" font-weight="bold" fill="#1f6d72">Help</text>
    <!-- the taskbar, redrawn, with the new button -->
    <rect y="988" width="864" height="164" fill="url(#bar)"/>
    <rect y="988" width="864" height="164" fill="url(#barshade)"/>
    <rect y="988" width="864" height="2" fill="#7fb6e6" opacity="0.8"/>
    <g transform="translate(0,1024) scale(1.45)">
      <g filter="url(#drop)"><use xlink:href="#shapeC" fill="url(#green)" stroke="#145a19" stroke-width="1.5"/></g>
      <rect width="320" height="30" fill="url(#shine)" clip-path="url(#clipC)"/>
      <use xlink:href="#label"/>
    </g>
  </g>
  <text x="1752" y="1198" font-family="Verdana, sans-serif" font-size="30" fill="#333">C - ramp</text>
</svg>
