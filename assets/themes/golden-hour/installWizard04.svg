 GB</text><rect x="770.876" y="283" width="103.26" height="32" fill="#c9c2b2" stroke="#ffffff" stroke-width="1.5"/><text x="822.506" y="297" font-family="Verdana, DejaVu Sans, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" >Free</text><text x="822.506" y="310" font-family="Verdana, DejaVu Sans, sans-serif" font-size="10" font-weight="normal" fill="#ffffff" text-anchor="middle" opacity="0.9">98 GB</text><rect x="876.136" y="283" width="6.864000000000001" height="32" fill="#5b6573" stroke="#ffffff" stroke-width="1.5"/><circle cx="338" cy="346" r="8" fill="#ffffff" stroke="#1f6d72" stroke-width="1.5"/><circle cx="338" cy="346" r="4.5" fill="#1f6d72"/><text x="356" y="351" font-family="Verdana, DejaVu Sans, sans-serif" font-size="13" font-weight="bold" fill="#1d2430" text-anchor="start" >Install MyOS in the free space (98 GB)</text><text x="356" y="369" font-family="Verdana, DejaVu Sans, sans-serif" font-size="11" font-weight="normal" fill="#5b6573" text-anchor="start" >Windows stays. You choose MyOS or Windows when the computer starts (F11).</text><circle cx="338" cy="396" r="8" fill="#ffffff" stroke="#5b6573" stroke-width="1.5"/><text x="356" y="401" font-family="Verdana, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#1d2430" text-anchor="start" >Erase this disk and install MyOS</text><text x="356" y="419" font-family="Verdana, DejaVu Sans, sans-serif" font-size="11" font-weight="normal" fill="#5b6573" text-anchor="start" >Windows and everything on this disk will be deleted.</text><circle cx="338" cy="446" r="8" fill="#ffffff" stroke="#5b6573" stroke-width="1.5"/><text x="356" y="451" font-family="Verdana, DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#1d2430" text-anchor="start" >Something else</text><text x="356" y="469" font-family="Verdana, DejaVu Sans, sans-serif" font-size="11" font-weight="normal" fill="#5b6573" text-anchor="start" >Choose partitions and sizes yourself.</text><rect x="